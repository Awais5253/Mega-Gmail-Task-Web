<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121827">
    <meta name="color-scheme" content="dark">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>{% block title %}Mega Gmail Task{% endblock %}</title>
    
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        html {
            background-color: #121827;
        }
        body {
            background: linear-gradient(180deg, #090d16 0%, #0d1322 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px calc(90px + env(safe-area-inset-bottom)) 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Fixed Bottom Navigation Bar (Zero Shift & Zero Blink) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121827;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom)) 0;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
            width: 100vw;
        }
        
        /* Har button strictly 20% width lega (No Size Shift) */
        .nav-item {
            flex: 1 1 20%;
            width: 20%;
            max-width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #7a8b9e;
            font-size: 11.5px;
            font-weight: 700;
            gap: 3px;
            text-align: center;
            box-sizing: border-box;
            transition: color 0.15s ease;
        }
        
        .nav-item.active {
            color: #00f2fe;
        }
        
        .nav-icon {
            font-size: 19px;
            line-height: 1;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body hx-boost="true" hx-select="#main-content" hx-target="#main-content" hx-swap="innerHTML">

    <div class="container" id="main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="bottom-nav" id="bottom-nav">
        <a href="/home" class="nav-item {% if request.path == '/home' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="/tasks" class="nav-item {% if request.path == '/tasks' %}active{% endif %}">
            <span class="nav-icon">📑</span>
            <span>Tasks</span>
        </a>
        <a href="/referrals" class="nav-item {% if request.path == '/referrals' %}active{% endif %}">
            <span class="nav-icon">🎁</span>
            <span>Refs</span>
        </a>
        <a href="/wallet" class="nav-item {% if request.path == '/wallet' %}active{% endif %}">
            <span class="nav-icon">👛</span>
            <span>Wallet</span>
        </a>
        <a href="/profile" class="nav-item {% if request.path == '/profile' %}active{% endif %}">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </a>
    </div>

    <script>
        document.addEventListener('htmx:afterSettle', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('href') === currentPath) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
