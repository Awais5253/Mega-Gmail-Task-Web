<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mega Gmail Task</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1c2541;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
        }
        h2 { text-align: center; color: #00f2fe; margin-bottom: 5px; }
        p { text-align: center; font-size: 14px; color: #a0aec0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3a506b;
            background: #0b132b;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #00f2fe;
            color: #0b132b;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #00f2fe; text-decoration: none; }
        .alert { background: #e53e3e; color: white; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mega Gmail Task</h2>
        <p>Create a new account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <!-- ریفرل کوڈ کو محفوظ رکھنے کے لیے ہڈن ان پٹ -->
            <input type="hidden" name="ref" value="{{ ref if ref else '' }}">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Your Full Name" maxlength="20" required>
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" name="whatsapp" placeholder="e.g. 03001234567" pattern="[0-9]{11}" maxlength="11" minlength="11" title="Please enter an 11-digit WhatsApp number" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Minimum 5 characters" minlength="5" required>
            </div>
            <button type="submit">Create Account</button>
        </form>

        <div class="link">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>
</body>
</html>
